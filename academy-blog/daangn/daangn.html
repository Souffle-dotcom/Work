<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>베이직클래스 당근 이벤트</title>
<!--
  당근 비즈프로필용 2027 새학기 준비 이벤트 이미지
  ?part=poster → 포스터 1080×1350 (4:5)
  ?part=c-elem → 초등 5% 쿠폰 1080×1080
  ?part=c-mid  → 중·고등 10% 쿠폰 1080×1080
  기한·할인율은 아래 EVENT 만 고치면 전체 반영.
-->
<style>
  :root{
    --navy:#082970; --navy-deep:#061d52; --ink:#16203f; --muted:#5b6380;
    --ivory:#f7f4ec; --gold:#a88a52; --gold-soft:#e9d8b4; --line:#d9d3c3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;font-family:'Noto Sans KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .serif{font-family:'Noto Serif KR',serif}
  .latin{font-family:'Cormorant Garamond',serif}
  .crest{--h:60px;width:calc(var(--h)*770/720);height:var(--h);flex:none;
    background:url(../src/logo.jpg) no-repeat;
    background-size:calc(var(--h)*1284/720) auto;
    background-position:calc(var(--h)*-245/720) calc(var(--h)*-85/720);
    mix-blend-mode:multiply}
  .brand{display:flex;align-items:center;gap:18px}
  .brand b{display:block;font-weight:900;letter-spacing:-.5px}
  .brand small{display:block;letter-spacing:5px;color:var(--navy)}

  /* ================= 포스터 1080×1350 ================= */
  .poster{position:relative;width:1080px;height:1350px;background:var(--ivory);overflow:hidden;isolation:isolate;padding:72px 76px}
  .poster::after{content:"";position:absolute;inset:28px;border:2px solid var(--line);pointer-events:none}
  .poster .brand .crest{--h:88px}
  .poster .brand b{font-size:40px}
  .poster .brand small{font-size:19px}
  .p-top{display:flex;justify-content:space-between;align-items:center}
  .p-chip{font-size:28px;font-weight:700;color:var(--gold);border:2px solid var(--gold);padding:10px 24px;border-radius:999px}

  .p-eyebrow{margin-top:64px;font-size:34px;font-weight:700;color:var(--navy)}
  .p-title{margin-top:14px;font-size:84px;line-height:1.2;font-weight:700;letter-spacing:-2.5px}
  .p-title em{font-style:normal;color:var(--navy);box-shadow:inset 0 -24px 0 rgba(168,138,82,.25)}

  .tiers{margin-top:52px;display:flex;gap:24px}
  .tier{flex:1;background:var(--navy);color:#fff;padding:30px 36px;text-align:center}
  .tier.mid{background:var(--navy-deep)}
  .tier .who{font-size:36px;font-weight:700}
  .tier .pct{font-family:'Noto Serif KR',serif;font-weight:900;font-size:140px;line-height:1.05;letter-spacing:-3px}
  .tier .pct sup{font-size:64px;vertical-align:top;position:relative;top:22px;margin-left:4px}
  .tier .per{display:inline-block;margin-top:8px;font-size:36px;font-weight:900;color:var(--navy);background:var(--gold-soft);padding:6px 20px}

  .subj{margin-top:52px;text-align:center}
  .subj .k{font-size:30px;font-weight:700;color:var(--gold)}
  .subj .v{margin-top:6px;font-size:48px;font-weight:900;letter-spacing:-1px}
  .subj .s{margin-top:6px;font-size:32px;color:var(--muted)}

  .p-foot{position:absolute;left:76px;right:76px;bottom:72px;text-align:center;border-top:2px solid var(--line);padding-top:30px}
  .p-foot .tel{font-size:64px;font-weight:900;color:var(--navy);letter-spacing:-1px;line-height:1.1}
  .p-foot .addr{margin-top:10px;font-size:30px;color:var(--muted)}

  /* ================= 쿠폰 1080×1080 ================= */
  .coupon{position:relative;width:1080px;height:1080px;background:#fff;padding:60px;isolation:isolate}
  .ticket{position:relative;width:960px;height:960px;display:flex;flex-direction:column;overflow:hidden}
  .t-top{position:relative;height:560px;background:var(--navy);color:#fff;padding:56px 64px;display:flex;flex-direction:column}
  .coupon.mid .t-top{background:var(--navy-deep)}
  .t-top .row{display:flex;justify-content:space-between;align-items:center}
  .t-top .k{font-size:24px;letter-spacing:8px;opacity:.75}
  .t-top .tag{font-size:22px;font-weight:700;color:var(--navy);background:var(--gold-soft);padding:8px 18px}
  .t-top .who{margin-top:40px;font-size:40px;font-weight:700}
  .t-top .big{display:flex;align-items:flex-end;gap:26px;margin-top:6px}
  .t-top .pct{font-family:'Noto Serif KR',serif;font-weight:900;font-size:220px;line-height:.95;letter-spacing:-6px}
  .t-top .pct sup{font-size:90px;vertical-align:top;position:relative;top:30px;margin-left:6px}
  .t-top .side{padding-bottom:22px}
  .t-top .side .per{display:inline-block;font-size:40px;font-weight:900;color:var(--navy);background:var(--gold-soft);padding:6px 18px}
  .t-top .side .dur{margin-top:12px;font-size:34px;font-weight:700}
  .t-top .subj{margin-top:auto;font-size:32px;opacity:.9;text-align:left}
  .divider{position:relative;height:0;border-top:4px dashed var(--line);margin:0 34px}
  .notch{position:absolute;top:560px;width:68px;height:68px;border-radius:50%;background:#fff;transform:translateY(-50%);z-index:3}
  .notch.l{left:-34px}.notch.r{right:-34px}
  .t-bot{flex:1;background:var(--ivory);padding:40px 64px;display:flex;flex-direction:column}
  .t-bot .brand .crest{--h:74px}
  .t-bot .brand b{font-size:34px}
  .t-bot .brand small{font-size:16px}
  .t-bot .terms{margin-top:22px;font-size:28px;line-height:1.6;color:var(--muted)}
  .t-bot .terms b{color:var(--ink)}
  .t-bot .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
  .t-bot .tel{font-size:38px;font-weight:900;color:var(--navy)}
  .t-bot .tel span{display:block;font-size:20px;font-weight:500;color:var(--muted)}
  .t-bot .no{font-size:20px;color:var(--muted)}
</style>
</head>
<body>
<div id="out"></div>
<script>
  // ---- 이벤트 조건 (여기만 고치면 됨) ----
  const EVENT = {
    deadline: '2026년 12월 31일',
    short: '12월 31일',
    tel: '0507-1480-3536',
    tiers: {
      elem: { who:'초등학생', pct:5 },
      mid:  { who:'중·고등학생', pct:10 },
    },
  };
  const brand = (cls='') => `<div class="brand ${cls}"><div class="crest"></div>
      <div><b>베이직클래스</b><small class="latin">FROM THE BASICS</small></div></div>`;

  function poster() {
    const t = EVENT.tiers;
    const tier = (x, cls='') => `<div class="tier ${cls}"><div class="who">${x.who}</div>
          <div class="pct">${x.pct}<sup>%</sup></div><div class="per">과목당 · 3개월</div></div>`;
    return `
    <div class="poster">
      <div class="p-top">${brand()}<div class="p-chip">당근 이웃 전용</div></div>
      <div class="p-eyebrow">${EVENT.short}까지 · 새 학기 준비 이벤트</div>
      <div class="p-title serif">등록하면 3개월간<br><em>과목당</em> 할인</div>
      <div class="tiers">${tier(t.elem)}${tier(t.mid, 'mid')}</div>
      <div class="subj">
        <div class="k">개설 과목</div>
        <div class="v">초·중·고 국어 · 영어 · 수학</div>
        <div class="s">한 반 최대 4명 소수정예</div>
      </div>
      <div class="p-foot">
        <div class="tel">☎ ${EVENT.tel}</div>
        <div class="addr">잠실본동 올림픽로12길 48 · 전화 예약 후 방문</div>
      </div>
    </div>`;
  }

  function coupon(key) {
    const t = EVENT.tiers[key];
    return `
    <div class="coupon ${key}">
      <div class="ticket">
        <div class="t-top">
          <div class="row"><div class="k">COUPON</div><div class="tag">당근 이웃 전용</div></div>
          <div class="who">${t.who}</div>
          <div class="big">
            <div class="pct">${t.pct}<sup>%</sup></div>
            <div class="side"><div class="per">과목당</div><div class="dur">3개월 할인</div></div>
          </div>
          <div class="subj">국 · 영 · 수 과목마다 각각 할인</div>
        </div>
        <div class="divider"></div>
        <div class="t-bot">
          ${brand()}
          <div class="terms">
            <b>${EVENT.short}까지 신규 등록 시</b><br>
            상담 때 이 화면을 보여주세요 · 중복 할인 불가
          </div>
          <div class="bottom">
            <div class="tel"><span>전화 상담</span>${EVENT.tel}</div>
          </div>
        </div>
        <div class="notch l"></div><div class="notch r"></div>
      </div>
    </div>`;
  }

  const part = new URLSearchParams(location.search).get('part') || 'poster';
  document.getElementById('out').innerHTML =
    part === 'poster' ? poster() : coupon(part === 'c-mid' ? 'mid' : 'elem');
</script>
</body>
</html>
