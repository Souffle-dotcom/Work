<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>베이직클래스 당근 이벤트</title>
<!--
  당근 비즈프로필용 2027 새학기 준비 이벤트 이미지
  ?part=poster → 포스터 1080×1350 (4:5)
  ?part=c-elem → 초등 5% 쿠폰 1080×1080
  ?part=c-mid  → 중·고등 10% 쿠폰 1080×1080
  기한·할인율은 아래 EVENT 만 고치면 전체 반영.
-->
<style>
  :root{
    --navy:#082970; --navy-deep:#061d52; --ink:#16203f; --muted:#5b6380;
    --ivory:#f7f4ec; --gold:#a88a52; --gold-soft:#e9d8b4; --line:#d9d3c3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;font-family:'Noto Sans KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .serif{font-family:'Noto Serif KR',serif}
  .latin{font-family:'Cormorant Garamond',serif}
  .crest{--h:60px;width:calc(var(--h)*770/720);height:var(--h);flex:none;
    background:url(../src/logo.jpg) no-repeat;
    background-size:calc(var(--h)*1284/720) auto;
    background-position:calc(var(--h)*-245/720) calc(var(--h)*-85/720);
    mix-blend-mode:multiply}
  .brand{display:flex;align-items:center;gap:18px}
  .brand b{display:block;font-weight:900;letter-spacing:-.5px}
  .brand small{display:block;letter-spacing:5px;color:var(--navy)}

  /* ================= 포스터 1080×1350 ================= */
  .poster{position:relative;width:1080px;height:1350px;background:var(--ivory);overflow:hidden;isolation:isolate;padding:72px 76px}
  .poster::after{content:"";position:absolute;inset:28px;border:2px solid var(--line);pointer-events:none}
  .poster .brand .crest{--h:88px}
  .poster .brand b{font-size:40px}
  .poster .brand small{font-size:19px}
  .p-top{display:flex;justify-content:space-between;align-items:center}
  .p-chip{font-size:22px;font-weight:700;color:var(--gold);border:2px solid var(--gold);padding:10px 22px;border-radius:999px}

  .p-eyebrow{margin-top:52px;font-size:28px;font-weight:700;color:var(--navy);letter-spacing:1px}
  .p-title{margin-top:10px;font-size:74px;line-height:1.2;font-weight:700;letter-spacing:-2.5px}
  .p-title em{font-style:normal;color:var(--navy);box-shadow:inset 0 -22px 0 rgba(168,138,82,.25)}
  .p-lead{margin-top:18px;font-size:27px;line-height:1.6;color:var(--muted)}
  .p-lead b{color:var(--ink)}

  .tiers{margin-top:34px;display:flex;gap:24px}
  .tier{flex:1;background:var(--navy);color:#fff;padding:24px 34px 24px;position:relative}
  .tier.mid{background:var(--navy-deep)}
  .tier .who{font-size:26px;font-weight:700;opacity:.9}
  .tier .pct{font-family:'Noto Serif KR',serif;font-weight:900;font-size:104px;line-height:1.05;letter-spacing:-3px}
  .tier .pct sup{font-size:56px;vertical-align:top;position:relative;top:18px;margin-left:4px}
  .tier .per{display:inline-block;margin-top:6px;font-size:26px;font-weight:900;color:var(--navy);background:var(--gold-soft);padding:6px 16px}
  .tier .dur{margin-top:12px;font-size:22px;opacity:.8}

  .grid{margin-top:32px;border-top:2px solid var(--navy)}
  .grid .cap{font-size:22px;font-weight:700;color:var(--navy);padding:16px 0 10px;display:flex;justify-content:space-between}
  .grid .cap span{font-weight:500;color:var(--muted)}
  .grid table{width:100%;border-collapse:collapse;font-size:25px}
  .grid td{border-bottom:1px solid var(--line);padding:13px 0;text-align:left}
  .grid td:first-child{font-weight:900;color:var(--navy);width:16%}
  .grid td:nth-child(2){font-weight:700;width:40%}
  .grid td:last-child{color:var(--muted);text-align:right}

  .p-foot{position:absolute;left:76px;right:76px;bottom:70px;display:flex;justify-content:space-between;align-items:flex-end}
  .p-foot .when{font-size:24px;color:var(--muted);line-height:1.6}
  .p-foot .when b{color:var(--ink);font-size:28px}
  .p-foot .tel{text-align:right}
  .p-foot .tel span{display:block;font-size:22px;color:var(--muted)}
  .p-foot .tel strong{font-size:50px;font-weight:900;color:var(--navy);letter-spacing:-1px}

  /* ================= 쿠폰 1080×1080 ================= */
  .coupon{position:relative;width:1080px;height:1080px;background:#fff;padding:60px;isolation:isolate}
  .ticket{position:relative;width:960px;height:960px;display:flex;flex-direction:column;overflow:hidden}
  .t-top{position:relative;height:560px;background:var(--navy);color:#fff;padding:56px 64px;display:flex;flex-direction:column}
  .coupon.mid .t-top{background:var(--navy-deep)}
  .t-top .row{display:flex;justify-content:space-between;align-items:center}
  .t-top .k{font-size:24px;letter-spacing:8px;opacity:.75}
  .t-top .tag{font-size:22px;font-weight:700;color:var(--navy);background:var(--gold-soft);padding:8px 18px}
  .t-top .who{margin-top:40px;font-size:40px;font-weight:700}
  .t-top .big{display:flex;align-items:flex-end;gap:26px;margin-top:6px}
  .t-top .pct{font-family:'Noto Serif KR',serif;font-weight:900;font-size:220px;line-height:.95;letter-spacing:-6px}
  .t-top .pct sup{font-size:90px;vertical-align:top;position:relative;top:30px;margin-left:6px}
  .t-top .side{padding-bottom:22px}
  .t-top .side .per{display:inline-block;font-size:40px;font-weight:900;color:var(--navy);background:var(--gold-soft);padding:6px 18px}
  .t-top .side .dur{margin-top:12px;font-size:34px;font-weight:700}
  .t-top .subj{margin-top:auto;font-size:26px;opacity:.85}
  .divider{position:relative;height:0;border-top:4px dashed var(--line);margin:0 34px}
  .notch{position:absolute;top:560px;width:68px;height:68px;border-radius:50%;background:#fff;transform:translateY(-50%);z-index:3}
  .notch.l{left:-34px}.notch.r{right:-34px}
  .t-bot{flex:1;background:var(--ivory);padding:40px 64px;display:flex;flex-direction:column}
  .t-bot .brand .crest{--h:74px}
  .t-bot .brand b{font-size:34px}
  .t-bot .brand small{font-size:16px}
  .t-bot .terms{margin-top:24px;font-size:22px;line-height:1.75;color:var(--muted)}
  .t-bot .terms b{color:var(--ink)}
  .t-bot .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
  .t-bot .tel{font-size:38px;font-weight:900;color:var(--navy)}
  .t-bot .tel span{display:block;font-size:20px;font-weight:500;color:var(--muted)}
  .t-bot .no{font-size:20px;color:var(--muted)}
</style>
</head>
<body>
<div id="out"></div>
<script>
  // ---- 이벤트 조건 (여기만 고치면 됨) ----
  const EVENT = {
    deadline: '2026년 12월 31일',
    tel: '0507-1480-3536',
    tiers: {
      elem: { who:'초등학생', pct:5 },
      mid:  { who:'중·고등학생', pct:10 },
    },
  };
  const brand = (cls='') => `<div class="brand ${cls}"><div class="crest"></div>
      <div><b>베이직클래스</b><small class="latin">FROM THE BASICS</small></div></div>`;

  function poster() {
    const t = EVENT.tiers;
    const row = (lv, note) => `<tr><td>${lv}</td><td>국어 · 영어 · 수학</td><td>${note}</td></tr>`;
    return `
    <div class="poster">
      <div class="p-top">${brand()}<div class="p-chip">당근 이웃 전용</div></div>
      <div class="p-eyebrow">2027학년도 새 학기 준비 이벤트</div>
      <div class="p-title serif">새 학기는 <em>기본부터</em>,<br>등록하면 3개월 할인</div>
      <div class="p-lead">당근 보고 오셔서 <b>${EVENT.deadline}까지 등록</b>하면<br>수강하는 <b>과목마다</b> 3개월 동안 할인해 드립니다.</div>
      <div class="tiers">
        <div class="tier"><div class="who">${t.elem.who}</div>
          <div class="pct">${t.elem.pct}<sup>%</sup></div>
          <div class="per">과목당 할인</div><div class="dur">등록월부터 3개월</div></div>
        <div class="tier mid"><div class="who">${t.mid.who}</div>
          <div class="pct">${t.mid.pct}<sup>%</sup></div>
          <div class="per">과목당 할인</div><div class="dur">등록월부터 3개월</div></div>
      </div>
      <div class="grid">
        <div class="cap">개설 과목 · 국어 · 영어 · 수학<span>한 반 최대 4명 소수정예</span></div>
        <table>
          ${row('초등', '개념 이해와 바른 공부 습관')}
          ${row('중등', '학교별 내신 · 탄탄한 현행')}
          ${row('고등', '내신 관리와 수능 기초')}
        </table>
      </div>
      <div class="p-foot">
        <div class="when"><b>잠실본동</b> 송파구 올림픽로12길 48, 301호<br>방문 상담은 전화 예약 후 가능합니다</div>
        <div class="tel"><span>전화 상담</span><strong>${EVENT.tel}</strong></div>
      </div>
    </div>`;
  }

  function coupon(key) {
    const t = EVENT.tiers[key];
    return `
    <div class="coupon ${key}">
      <div class="ticket">
        <div class="t-top">
          <div class="row"><div class="k">COUPON</div><div class="tag">당근 이웃 전용</div></div>
          <div class="who">${t.who}</div>
          <div class="big">
            <div class="pct">${t.pct}<sup>%</sup></div>
            <div class="side"><div class="per">과목당</div><div class="dur">3개월 할인</div></div>
          </div>
          <div class="subj">국어 · 영어 · 수학 중 수강하는 과목마다 각각 적용</div>
        </div>
        <div class="divider"></div>
        <div class="t-bot">
          ${brand()}
          <div class="terms">
            <b>사용 조건</b> ${EVENT.deadline}까지 신규 등록 시 · 등록월부터 3개월간 적용<br>
            상담 때 이 쿠폰 화면을 보여주세요 · 다른 할인과 중복 불가 · 현금 교환 불가
          </div>
          <div class="bottom">
            <div class="tel"><span>전화 상담 · 방문 예약</span>${EVENT.tel}</div>
            <div class="no">2027 새 학기 준비 이벤트</div>
          </div>
        </div>
        <div class="notch l"></div><div class="notch r"></div>
      </div>
    </div>`;
  }

  const part = new URLSearchParams(location.search).get('part') || 'poster';
  document.getElementById('out').innerHTML =
    part === 'poster' ? poster() : coupon(part === 'c-mid' ? 'mid' : 'elem');
</script>
</body>
</html>
