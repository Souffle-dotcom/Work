<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>베이직클래스 콜라보 쿠폰</title>
<!--
  리틀바하음악학원 재원생 전용 쿠폰 (베이직클래스 발행)
  ?part=low   → 초등 저학년 쿠폰 1장 (1200×600)
  ?part=high  → 초등 고학년 쿠폰 1장 (1200×600)
  ?part=print → A4 인쇄용 PDF (1쪽 저학년 3장, 2쪽 고학년 3장, 일련번호 칸)
  금액·기한은 아래 COUPONS / VALID 만 고치면 전체 반영.
-->
<style>
  :root{
    --navy:#082970; --navy-deep:#061d52; --ink:#16203f; --muted:#5b6380;
    --ivory:#f7f4ec; --gold:#a88a52; --line:#d9d3c3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;font-family:'Noto Sans KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .serif{font-family:'Noto Serif KR',serif}
  .latin{font-family:'Cormorant Garamond',serif}
  .crest{--h:60px;width:calc(var(--h)*770/720);height:var(--h);flex:none;
    background:url(../src/logo.jpg) no-repeat;
    background-size:calc(var(--h)*1284/720) auto;
    background-position:calc(var(--h)*-245/720) calc(var(--h)*-85/720);
    mix-blend-mode:multiply}

  /* ---------- 쿠폰 (기준 1200×600, 인쇄 시 scale) ---------- */
  .coupon{position:relative;width:1200px;height:600px;display:flex;background:var(--ivory);isolation:isolate;overflow:hidden}
  .main{position:relative;flex:1;padding:44px 52px 40px}
  .main::after{content:"";position:absolute;inset:18px 0 18px 18px;border:1.5px solid var(--line);border-right:none;pointer-events:none}
  .stub{position:relative;width:300px;background:var(--navy);color:#fff;display:flex;flex-direction:column;
        align-items:center;justify-content:center;text-align:center}
  /* 절취선 + 반원 홈 */
  .stub::before{content:"";position:absolute;left:-1px;top:24px;bottom:24px;border-left:3px dashed rgba(255,255,255,.55)}
  .notch{position:absolute;left:-26px;width:52px;height:52px;border-radius:50%;background:#fff;z-index:2}
  .notch.t{top:-26px}.notch.b{bottom:-26px}

  .head{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .crest{--h:62px}
  .brand b{display:block;font-size:26px;font-weight:900;letter-spacing:-.5px}
  .brand small{display:block;font-size:13px;letter-spacing:4px;color:var(--navy)}
  .collab{font-size:15px;font-weight:700;color:var(--gold);border:1.5px solid var(--gold);padding:7px 14px;border-radius:999px}

  .tag{margin-top:34px;font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.5px}
  .title{margin-top:6px;font-size:46px;font-weight:700;letter-spacing:-1.2px;line-height:1.2}
  .title em{font-style:normal;color:var(--navy);box-shadow:inset 0 -12px 0 rgba(168,138,82,.22)}
  .subj{margin-top:14px;display:flex;gap:8px;align-items:center}
  .subj i{font-style:normal;font-size:15px;font-weight:700;color:var(--navy);border:1.5px solid var(--navy);
          width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff}
  .subj span{font-size:15px;color:var(--muted);margin-left:6px}

  .price{margin-top:26px;display:flex;align-items:baseline;gap:14px}
  .price s{font-size:22px;color:var(--muted)}
  .price .arrow{font-size:22px;color:var(--gold)}
  .price strong{font-size:40px;font-weight:900;color:var(--navy);letter-spacing:-1px}
  .price small{font-size:17px;color:var(--muted)}
  .terms{position:absolute;left:52px;right:40px;bottom:40px;font-size:13.5px;line-height:1.75;color:var(--muted)}
  .terms b{color:var(--ink)}

  .stub .k{font-size:15px;letter-spacing:3px;opacity:.8}
  .stub .pct{font-family:'Noto Serif KR',serif;font-weight:700;font-size:120px;line-height:1;margin-top:6px}
  .stub .pct sup{font-size:56px;vertical-align:top;position:relative;top:16px}
  .stub .off{font-size:22px;font-weight:700;letter-spacing:6px;margin-top:-2px}
  .stub .months{margin-top:18px;font-size:19px;font-weight:700;padding:8px 18px;border:1.5px solid rgba(255,255,255,.6)}
  .stub .no{position:absolute;bottom:40px;left:0;right:0;font-size:14px;opacity:.85}
  .stub .tel{position:absolute;top:44px;left:0;right:0;font-size:14px;opacity:.85}

  /* ---------- 인쇄: A4 한 쪽에 3장 (180×90mm), 점선을 따라 자름 ---------- */
  @page{size:A4;margin:12mm 15mm}
  .sheet{width:180mm;height:273mm;display:flex;flex-direction:column;justify-content:space-between;page-break-after:always}
  .sheet:last-child{page-break-after:auto}
  .cell{width:180mm;height:90mm;overflow:hidden;outline:1px dashed #aaa}
  .cell .coupon{transform-origin:0 0;transform:scale(.56693)}  /* 1200px → 180mm */
</style>
</head>
<body>
<div id="out"></div>
<script>
  // ---- 발행 조건 (여기만 고치면 됨) ----
  const VALID = '2026. 12. 31.';      // 사용 기한(등록 기준)
  const COUPONS = {
    low:  { grade:'초등 저학년', range:'초1 · 초2 · 초3', base:169000 },
    high: { grade:'초등 고학년', range:'초4 · 초5 · 초6', base:199000 },
  };
  const won = n => n.toLocaleString('ko-KR') + '원';

  function coupon(key, serial) {
    const c = COUPONS[key], sale = Math.round(c.base * 0.9);
    return `
    <div class="coupon">
      <div class="main">
        <div class="head">
          <div class="brand"><div class="crest"></div>
            <div><b>베이직클래스</b><small class="latin">FROM THE BASICS</small></div></div>
          <div class="collab">with 리틀바하음악학원</div>
        </div>
        <div class="tag">리틀바하음악학원 재원생 전용 · ${c.grade} (${c.range})</div>
        <div class="title serif">국어·영어·수학 <em>3개월 10%</em> 할인</div>
        <div class="subj"><i>국</i><i>영</i><i>수</i><span>과목별 적용</span></div>
        <div class="price"><s>월 ${won(c.base)}</s><span class="arrow">→</span>
          <strong>월 ${won(sale)}</strong><small>(과목당 · 3개월간)</small></div>
        <div class="terms">
          <b>사용 기한</b> ${VALID}까지 등록 시 · 등록월부터 3개월간 적용<br>
          리틀바하음악학원 재원 확인 후 적용 · 신규 등록 학생에 한함 · 다른 할인과 중복 불가 · 현금 교환 불가
        </div>
      </div>
      <div class="stub">
        <div class="notch t"></div><div class="notch b"></div>
        <div class="tel">상담 0507-1480-3536</div>
        <div class="k">COUPON</div>
        <div class="pct">10<sup>%</sup></div>
        <div class="off">OFF</div>
        <div class="months">3개월</div>
        <div class="no">${serial || 'No. ____________'}</div>
      </div>
    </div>`;
  }

  const part = new URLSearchParams(location.search).get('part') || 'low';
  const out = document.getElementById('out');
  if (part === 'print') {
    const sheet = key => `<div class="sheet">${[0,1,2].map(() =>
      `<div class="cell">${coupon(key)}</div>`).join('')}</div>`;
    out.innerHTML = sheet('low') + sheet('high');
  } else {
    out.innerHTML = coupon(part);
  }
</script>
</body>
</html>
