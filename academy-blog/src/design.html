<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>베이직클래스 블로그 디자인</title>
<!--
  네이버 블로그 개편용 이미지 원본 (v2: 로고 반영, 차분한 신뢰형).
  ?part=title   → 타이틀 이미지 (966×440)
  ?part=btn-N   → 위젯 버튼 N (170×170, N=1..5)
  ?part=mobile  → 모바일 커버 (1080×1080)
  ?part=preview → 적용 후 모습 미리보기
  로고 원본: logo.jpg (흰 배경 → mix-blend-mode:multiply로 배경에 녹임)
-->
<style>
  :root{
    --navy:#082970;       /* 로고 방패 색 */
    --navy-deep:#061d52;
    --ink:#16203f;
    --muted:#5b6380;
    --ivory:#f7f4ec;
    --gold:#a88a52;
    --line:#d9d3c3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;font-family:'Noto Sans KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .serif{font-family:'Noto Serif KR',serif}
  .latin{font-family:'Cormorant Garamond',serif}

  /* 로고 방패 부분만 잘라 쓰기: 원본 1284×1263 중 (245,85)–(1015,805) */
  .crest{--h:60px;width:calc(var(--h)*770/720);height:var(--h);flex:none;
    background:url(logo.jpg) no-repeat;
    background-size:calc(var(--h)*1284/720) auto;
    background-position:calc(var(--h)*-245/720) calc(var(--h)*-85/720);
    mix-blend-mode:multiply}

  /* ---------- 타이틀 ---------- */
  .title{position:relative;width:966px;height:440px;overflow:hidden;background:var(--ivory);isolation:isolate}
  .title::after{content:"";position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none}
  .bar{position:absolute;left:44px;right:44px;top:30px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .crest{--h:58px}
  .brand b{display:block;font-size:26px;font-weight:900;letter-spacing:-.5px;color:var(--ink)}
  .brand small{display:block;font-size:13px;letter-spacing:4px;color:var(--navy);margin-top:1px}
  .tel{text-align:right}
  .tel span{display:block;font-size:12px;color:var(--muted);letter-spacing:1px}
  .tel strong{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
  .rule{position:absolute;left:44px;right:44px;top:108px;height:1px;background:var(--line)}

  .hero{position:absolute;left:44px;top:136px;width:460px}
  .eyebrow{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1px}
  .hero h1{margin-top:14px;font-size:40px;line-height:1.3;font-weight:700;letter-spacing:-1px;color:var(--ink)}
  .hero h1 em{font-style:normal;color:var(--navy);box-shadow:inset 0 -10px 0 rgba(168,138,82,.22)}
  .hero p{margin-top:16px;font-size:15.5px;line-height:1.7;color:var(--muted)}
  .facts{margin-top:20px;display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .facts div{flex:1;padding:10px 0;text-align:center;font-size:14px;font-weight:700;color:var(--navy)}
  .facts div+div{border-left:1px solid var(--line)}

  .grades{position:absolute;right:44px;top:136px;width:356px;display:flex;flex-direction:column;gap:12px}
  .grade{display:flex;align-items:center;gap:16px;padding:16px 20px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy)}
  .grade .no{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
     font-size:19px;font-weight:700;color:var(--navy);border:1.5px solid var(--navy)}
  .grade h3{font-size:18px;font-weight:700;letter-spacing:-.3px}
  .grade p{font-size:13.5px;color:var(--muted);margin-top:2px}
  .watermark{position:absolute;right:-40px;bottom:-70px;opacity:.07}
  .watermark .crest{--h:360px}

  /* ---------- 버튼 위젯 ---------- */
  .btn{width:170px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
       background:var(--navy);color:#fff;text-align:center}
  .btn svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn b{font-size:18px;font-weight:700;letter-spacing:-.3px}
  .btn small{font-size:12px;opacity:.72;margin-top:-8px}
  .btn.deep{background:var(--navy-deep)}
  .btn.ivory{background:var(--ivory);color:var(--navy);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.call{background:var(--navy);color:#fff;gap:8px}
  .btn.call .num{font-size:18px;font-weight:700;color:#e9d8b4}
  .btn.call .hint{margin-top:-2px}

  /* ---------- 모바일 커버 ---------- */
  .mobile{position:relative;width:1080px;height:1080px;background:var(--ivory);display:flex;flex-direction:column;
          align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate}
  .mobile::after{content:"";position:absolute;inset:36px;border:2px solid var(--line)}
  .mobile .crest{--h:230px}
  .mobile .name{margin-top:26px;font-size:64px;font-weight:900;letter-spacing:-1px}
  .mobile .slogan{font-size:30px;letter-spacing:10px;color:var(--navy);margin-top:4px}
  .mobile h1{margin-top:56px;font-size:58px;line-height:1.35;font-weight:700;letter-spacing:-1.5px}
  .mobile h1 em{font-style:normal;color:var(--navy);box-shadow:inset 0 -16px 0 rgba(168,138,82,.22)}
  .mobile .sub{margin-top:30px;font-size:30px;color:var(--muted)}
  .mobile .mtel{margin-top:44px;font-size:44px;font-weight:700;color:var(--navy)}

  /* ---------- 미리보기 ---------- */
  .preview{width:966px;background:#fff}
  .row{display:flex;justify-content:space-between;padding:24px 0 26px}
  .notice{margin:0 0 24px;border-top:2px solid var(--navy);font-size:13px;color:#555}
  .notice div{padding:10px 4px;border-bottom:1px solid #e6e7ee}
  .notice span{color:var(--navy);font-weight:700;margin-right:8px}
</style>
</head>
<body>

<template id="title-tpl">
  <div class="title">
    <div class="watermark"><div class="crest"></div></div>
    <div class="bar">
      <div class="brand"><div class="crest"></div>
        <div><b>베이직클래스</b><small class="latin">FROM THE BASICS</small></div></div>
      <div class="tel"><span>전화 상담</span><strong>0507-1480-3536</strong></div>
    </div>
    <div class="rule"></div>
    <div class="hero">
      <div class="eyebrow">잠실본동 · 초·중·고 전과목 소수정예</div>
      <h1 class="serif">기본부터 바로 세우고,<br><em>끝까지</em> 확인합니다.</h1>
      <p>작은 학원이라 가능한 소수정예 수업으로<br>학생 한 명 한 명의 빈틈을 찾아 채웁니다.</p>
      <div class="facts"><div>한 반 최대 4명</div><div>소수정예</div><div>학교별 내신</div></div>
    </div>
    <div class="grades">
      <div class="grade"><div class="no serif">초</div><div><h3>초등부</h3><p>개념 이해와 바른 공부 습관</p></div></div>
      <div class="grade"><div class="no serif">중</div><div><h3>중등부</h3><p>학교별 내신 · 탄탄한 현행</p></div></div>
      <div class="grade"><div class="no serif">고</div><div><h3>고등부</h3><p>내신 관리와 수능 기초</p></div></div>
    </div>
  </div>
</template>

<template id="mobile-tpl">
  <div class="mobile">
    <div class="crest"></div>
    <div class="name">베이직클래스</div>
    <div class="slogan latin">FROM THE BASICS</div>
    <h1 class="serif">기본부터 바로 세우고,<br><em>끝까지</em> 확인합니다.</h1>
    <div class="sub">잠실본동 · 초·중·고 · 한 반 최대 4명 소수정예</div>
    <div class="mtel">☎ 0507-1480-3536</div>
    <div class="sub" style="margin-top:12px;font-size:26px">전화로 방문 상담을 예약해 주세요</div>
  </div>
</template>

<template id="btn-1"><div class="btn ivory">
  <svg viewBox="0 0 48 48"><path d="M24 12c-5-3-11-4-17-3v27c6-1 12 0 17 3 5-3 11-4 17-3V9c-6-1-12 0-17 3zM24 12v27"/></svg>
  <b>수업 안내</b><small>학년·과목별 과정</small></div></template>
<template id="btn-2"><div class="btn ivory">
  <svg viewBox="0 0 48 48"><rect x="7" y="9" width="34" height="32" rx="2"/><path d="M7 18h34M16 5v8M32 5v8M14 26h6M28 26h6M14 33h6"/></svg>
  <b>시간표·반 안내</b><small>소수정예 반 편성</small></div></template>
<template id="btn-3"><div class="btn ivory">
  <svg viewBox="0 0 48 48"><path d="M6 20L24 9l18 11M10 22v17h28V22M20 39v-9h8v9"/></svg>
  <b>학교별 내신</b><small>시험 일정·범위</small></div></template>
<template id="btn-4"><div class="btn ivory">
  <svg viewBox="0 0 48 48"><path d="M24 43s13-12.5 13-23a13 13 0 0 0-26 0c0 10.5 13 23 13 23z"/><circle cx="24" cy="20" r="5"/></svg>
  <b>오시는 길</b><small>송파구 올림픽로12길 48</small></div></template>
<template id="btn-5"><div class="btn call">
  <svg viewBox="0 0 48 48"><path d="M17 7l-6 1c-2 .5-3.5 2.5-3 4.7C11 26 22 37 35.3 40c2.2.5 4.2-1 4.7-3l1-6-8-4-4 4c-5-2.5-9.5-7-12-12l4-4z"/></svg>
  <b>전화 상담</b><span class="num">0507-1480-3536</span><small class="hint">방문 상담 예약</small></div></template>

<div id="out"></div>

<script>
  const part = new URLSearchParams(location.search).get('part') || 'preview';
  const out = document.getElementById('out');
  const clone = id => document.getElementById(id).content.cloneNode(true);
  if (part === 'title') out.appendChild(clone('title-tpl'));
  else if (part === 'mobile') out.appendChild(clone('mobile-tpl'));
  else if (part.startsWith('btn-')) out.appendChild(clone(part));
  else {
    const p = document.createElement('div'); p.className = 'preview';
    p.appendChild(clone('title-tpl'));
    const row = document.createElement('div'); row.className = 'row';
    for (let i = 1; i <= 5; i++) row.appendChild(clone('btn-' + i));
    p.appendChild(row);
    const n = document.createElement('div'); n.className = 'notice';
    n.innerHTML = '<div><span>공지</span>[필독] 베이직클래스 학년별 수업 안내 (초등부·중등부·고등부)</div>' +
                  '<div><span>공지</span>[시간표·반 안내] 잠실본동 베이직클래스, 한 반 최대 4명 소수정예 수업 안내</div>' +
                  '<div><span>공지</span>[상담 예약] 방문 상담 예약 방법 · 오시는 길</div>';
    p.appendChild(n);
    out.appendChild(p);
  }
</script>
</body>
</html>
